version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ems_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ems_db
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ems_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb+srv://adel:adelk@cluster0.jy6hp.mongodb.net/ems_db?retryWrites=true&w=majority&appName=Cluster0
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: super_secret_access_key_10k_users_2026_enterprise
      JWT_REFRESH_SECRET: super_secret_refresh_key_10k_users_2026_enterprise
      CORS_ORIGIN: http://localhost
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ems_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: ems_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
